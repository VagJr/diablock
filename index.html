<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<title>DIABLOCK - LEGACY OF SHADOWS [GOLD]</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
/* --- TYPOGRAPHY & CORE --- */
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=VT323&display=swap');

html, body { 
    margin: 0; width: 100%; height: 100%; 
    background: #020002; /* Void Color */
    overflow: hidden; 
    font-family: 'VT323', monospace; 
    user-select: none; color: #c00; 
    touch-action: none; 
}

canvas { 
    width: 100%; height: 100%; 
    image-rendering: pixelated; 
    cursor: crosshair; display: block; 
}

/* --- ATMOSPHERE & POST-PROCESSING --- */
.scanlines { 
    position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; 
    background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.2) 50%);
    background-size: 100% 4px; z-index: 999; opacity: 0.6;
}
.vignette { 
    position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; 
    background: radial-gradient(circle, rgba(0,0,0,0) 55%, rgba(10,0,5,0.95) 100%); 
    box-shadow: inset 0 0 100px rgba(0,0,0,0.8);
    z-index: 998; 
}

/* --- UI LAYOUT --- */
#ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }

/* --- HUD BOTTOM --- */
.hud-bottom { 
    position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); 
    display: flex; flex-direction: column; align-items: center; 
    z-index: 100;
}

.bar-box { 
    width: 360px; padding: 12px; 
    background: rgba(10, 0, 5, 0.95); 
    border: 2px solid #4a0d0d; /* Blood Iron */
    border-top: 4px solid #601010;
    box-shadow: 0 0 20px rgba(0,0,0,0.8), inset 0 0 20px #200; 
    margin-bottom: 15px; 
    position: relative;
}
.bar-box::before { /* Decorative rivets */
    content: ""; position: absolute; top: 2px; left: 2px; width: 6px; height: 6px; background: #601010; box-shadow: 348px 0 0 #601010;
}

.bar-status-text { 
    display: flex; justify-content: space-between; font-size: 18px; 
    color: #ddd; margin-bottom: 4px; text-shadow: 2px 2px 0 #000; letter-spacing: 1px; 
}

/* --- BARS (LIQUID STYLE) --- */
.bar-container { 
    width: 100%; height: 16px; background: #050000; margin-bottom: 8px; 
    border: 1px solid #333; position: relative; overflow: hidden; 
    box-shadow: inset 0 0 5px #000;
}
.bar-container.xp { height: 6px; border-color: #430; margin-top: 5px; }

.fill { height: 100%; transition: width 0.2s; position: relative; }
.fill::after { /* Shiny gloss effect */
    content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 50%; 
    background: rgba(255,255,255,0.2); 
}
.fill.hp { background: linear-gradient(90deg, #800, #f00); box-shadow: 0 0 10px #f00; } 
.fill.mp { background: linear-gradient(90deg, #004, #08f); box-shadow: 0 0 10px #00f; } 
.fill.xp { background: linear-gradient(90deg, #630, #fa0); }

/* --- SKILLS & BUTTONS --- */
.skills { display: flex; gap: 10px; pointer-events: auto; align-items: flex-end; }
.skill-btn { 
    width: 48px; height: 48px; background: #150505; 
    border: 2px solid #500; color: #f55; 
    display: flex; align-items: center; justify-content: center; 
    font-size: 16px; cursor: pointer; position: relative; 
    box-shadow: 0 0 5px #300, inset 0 0 10px #000; 
    transition: all 0.1s; font-family: 'VT323';
}
.skill-btn:hover { 
    background: #400; color: #fff; border-color: #f00; 
    box-shadow: 0 0 15px #f00; transform: translateY(-2px); 
    text-shadow: 0 0 5px #fff;
}
.skill-btn:active { transform: translateY(0); box-shadow: inset 0 0 15px #000; }
.key-hint { 
    position: absolute; top: -16px; left: 0; width: 100%; text-align: center;
    font-size: 12px; color: #888; text-shadow: 1px 1px #000; font-family: 'Arial';
}

/* --- PANELS (GOTHIC TERMINAL) --- */
.panel { 
    display: none; position: absolute; 
    background: #080000; 
    border: 2px solid #611; 
    padding: 16px; pointer-events: auto; color: #a00; 
    box-shadow: 0 0 30px rgba(0,0,0,0.9), inset 0 0 50px #100; 
    border-radius: 2px;
}
.panel-header { 
    text-align: center; border-bottom: 2px solid #400; 
    font-family: 'Cinzel', serif; font-size: 24px; 
    padding-bottom: 8px; margin-bottom: 12px; 
    color: #f22; text-shadow: 0 0 10px #900; letter-spacing: 2px; 
}

#inventory { top: 50%; left: 65%; transform: translate(-50%, -50%); width: 330px; }
#craft-panel { top: 50%; left: 35%; transform: translate(-50%, -50%); width: 260px; border-color: #505; box-shadow: 0 0 30px #202, inset 0 0 30px #101; }
#char-panel { top: 50%; left: 20%; transform: translate(-50%, -50%); width: 240px; border-color: #640; color: #ca0; }
#shop-panel { top: 45%; left: 50%; transform: translate(-50%, -50%); width: 350px; border-color: #055; background: #000808; color: #0cc; }

/* --- GRID & ITEMS --- */
.grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; margin-top: 5px; }
.slot { 
    width: 36px; height: 36px; background: #1a0505; 
    border: 1px solid #400; cursor: pointer; 
    position: relative; display: flex; align-items: center; justify-content: center; 
    font-size: 20px; box-shadow: inset 0 0 5px #000;
    transition: transform 0.1s;
}
.slot:hover { 
    background: #3a0a0a; border-color: #f00; 
    box-shadow: 0 0 10px #f00; z-index: 10; transform: scale(1.1);
}

.stat-row { display: flex; justify-content: space-between; margin-bottom: 8px; align-items: center; font-size: 20px; text-shadow: 1px 1px 0 #000; }
.plus-btn { 
    background: #300; border: 1px solid #600; color: #f00; 
    width: 20px; height: 20px; line-height: 18px; text-align: center; 
    cursor: pointer; font-size: 16px; border-radius: 2px; 
}
.plus-btn:hover { background: #f00; color: #000; }

#tooltip { 
    position: absolute; background: rgba(5, 0, 0, 0.95); 
    border: 1px solid #f00; padding: 10px; z-index: 1100; 
    display: none; pointer-events: none; font-size: 16px; color: #fff; 
    white-space: nowrap; box-shadow: 0 0 15px rgba(255,0,0,0.4); 
    border-top: 3px solid #f00;
}

/* --- MENU --- */
#menu { 
    position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
    background: #020002; display: flex; flex-direction: column; 
    align-items: center; justify-content: center; pointer-events: auto; z-index: 2000; 
    background-image: radial-gradient(circle, #100 0%, #000 70%);
}
h1 { 
    font-family: 'Cinzel', serif;
    text-shadow: 0 0 10px #f00, 4px 4px #500; 
    color: #f00; letter-spacing: 10px; font-size: 90px; margin-bottom: 0px; 
    animation: pulse 3s infinite; 
}
@keyframes pulse { 0% { text-shadow: 0 0 10px #f00; opacity: 0.9; } 50% { text-shadow: 0 0 30px #f00, 0 0 60px #f00; opacity: 1; } 100% { text-shadow: 0 0 10px #f00; opacity: 0.9; } }

.btn { 
    padding: 14px 28px; background: #200; color: #f00; 
    border: 2px solid #500; margin: 10px; cursor: pointer; 
    font-family: 'Cinzel', serif; font-size: 22px; letter-spacing: 2px; 
    transition: 0.2s; min-width: 180px; text-transform: uppercase;
    box-shadow: 0 0 10px #300;
}
.btn:hover { 
    background: #500; color: #fff; 
    box-shadow: 0 0 25px #f00; border-color: #f00; 
    transform: scale(1.05); 
}
input, select { 
    padding: 12px; background: #100; border: 2px solid #500; 
    color: #f00; margin: 5px; font-family: 'VT323'; font-size: 22px; 
    text-align: center; box-shadow: inset 0 0 10px #000;
}
input:focus { outline: none; border-color: #f00; box-shadow: 0 0 15px #f00; }

#game-log-container {
    position: absolute; top: 10px; right: 10px; width: 320px; height: 220px;
    background: linear-gradient(to left, rgba(0,0,0,0.9), rgba(0,0,0,0)); 
    border-right: 2px solid #500; padding: 10px; pointer-events: none; 
    overflow: hidden; font-size: 14px; z-index: 20; 
    text-shadow: 1px 1px 0 #000;
}
#game-log { display: flex; flex-direction: column-reverse; gap: 4px; height: 100%; overflow-y: scroll; }
#game-log::-webkit-scrollbar { display: none; }

/* --- MOBILE CONTROLS --- */
#mobile-controls { display: none; position: fixed; bottom: 0; left: 0; width: 100%; height: 140px; pointer-events: none; z-index: 5; }
#joystick-area { position: absolute; bottom: 20px; left: 20px; width: 120px; height: 120px; pointer-events: auto; }
#joystick-base { position: absolute; left: 30px; bottom: 30px; width: 100px; height: 100px; border: 2px solid rgba(255, 50, 50, 0.3); background: rgba(20, 0, 0, 0.2); border-radius: 50%; pointer-events: none; }
#joystick-knob { position: absolute; width: 50px; height: 50px; background: rgba(255, 0, 0, 0.5); border: 2px solid #f00; border-radius: 50%; pointer-events: none; display:none; box-shadow: 0 0 15px #f00; }

#action-container { right: 20px; width: 180px; height: 140px; bottom: 0px; position: absolute; pointer-events: auto; }
.action-btn { position: absolute; border-radius: 50%; background: rgba(50, 0, 0, 0.6); border: 2px solid #500; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: bold; box-shadow: 0 0 10px rgba(0,0,0,0.5); backdrop-filter: blur(4px); }
.action-btn:active { background: #f00; color: #000; transform: scale(0.95); box-shadow: 0 0 20px #f00; }

#btn-atk { width: 70px; height: 70px; bottom: 10px; right: 10px; border-color: #f00; color: #fcc; font-size: 20px; } 
#btn-skill { width: 55px; height: 55px; bottom: 85px; right: 20px; border-color: #0ff; color: #aff; } 
#btn-dash { width: 55px; height: 55px; bottom: 10px; right: 90px; border-color: #fff; } 
#btn-potion { width: 45px; height: 45px; bottom: 90px; right: 85px; border-color: #f33; font-size: 12px; }

#mobile-menu-buttons { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; pointer-events: auto; z-index: 10; }
#mobile-menu-buttons .skill-btn { width: 40px; height: 40px; font-size: 12px; border-radius: 50%; }

@media (max-width: 1024px) { 
    .hud-bottom { display: none !important; } 
    #mobile-controls { display: block; }
    #game-log-container { top: 50px; height: 80px; width: 200px; font-size: 12px; background: rgba(0,0,0,0.4); border: none; }
    #shop-panel, #inventory, #char-panel, #craft-panel { top: 50%; left: 50%; transform: translate(-50%, -50%); width: 90%; }
}

#chat-container { position: absolute; bottom: 120px; left: 50%; transform: translateX(-50%); width: 350px; display: none; pointer-events: auto; }
#chat-input { width: 100%; background: rgba(0,0,0,0.8); border: 1px solid #0f0; color: #fff; padding: 8px; font-family: inherit; box-shadow: 0 0 15px #0f0; }

</style>
</head>
<body oncontextmenu="return false">
<canvas id="c"></canvas>
<div class="scanlines"></div>
<div class="vignette"></div>
<div id="tooltip"></div>

<div id="ui-layer">
    <div id="hud-gold" style="position: absolute; top: 15px; left: 15px; font-size: 24px; color: #fb0; text-shadow: 0 0 5px #f80; font-weight: bold; font-family: 'Cinzel', serif;"></div>
    <div id="game-log-container"><div id="game-log"></div></div>

    <div id="chat-container"><input type="text" id="chat-input" placeholder="Say something..." maxlength="40"></div>
    
    <div class="hud-bottom">
        <div class="bar-box">
            <div class="bar-status-text">
                <span id="lvl-txt" style="color:#fb0">LVL 1</span>
                <span id="hp-txt">100/100</span>
            </div>
            <div class="bar-container hp"><div class="fill hp" id="hp-bar" style="width:100%"></div></div>
            
            <div class="bar-status-text" style="color:#aaf; font-size:16px;">
                <span>MANA</span>
                <span id="mp-txt">50/50</span>
            </div>
            <div class="bar-container mp"><div class="fill mp" id="mp-bar" style="width:100%"></div></div>
            
            <div class="bar-container xp"><div class="fill xp" id="xp-bar" style="width:0%"></div></div>
        </div>
        <div class="skills">
            <div class="skill-btn" onclick="socket.emit('attack', getAttackAngle())">ATK</div>
            <div class="skill-btn" id="skill-1" onclick="socket.emit('skill', {angle: getAttackAngle()})"><span class="key-hint">E</span>SKL</div>
            <div class="skill-btn" id="skill-dash" onclick="socket.emit('dash', getDashAngle())"><span class="key-hint">SPC</span>DSH</div>
            <div class="skill-btn" id="hud-potion" onclick="socket.emit('potion')"><span class="key-hint">Q</span>POT</div>
            <div style="width:10px;"></div>
            <div class="skill-btn" onclick="toggleUI('inv')"><span class="key-hint">I</span>INV</div>
            <div class="skill-btn" onclick="toggleUI('craft')"><span class="key-hint">K</span>CFT</div>
            <div class="skill-btn" onclick="toggleUI('char')"><span class="key-hint">C</span>CHR</div>
        </div>
    </div>
    
    <div id="entry-modal" class="panel" style="z-index: 2500;">
        <h3 style="margin-top:0; color:#f00; text-shadow: 0 0 10px #f00; font-size: 28px; text-align: center; font-family: 'Cinzel';">GATEWAY TO HELL</h3>
        <div id="checkpoint-list" class="checkpoint-list"></div>
        <button class="btn" onclick="dungeonAction('coop')" style="width:100%; color:#0f0; border-color:#0f0; font-size:16px;">JOIN CO-OP PARTY</button>
        <button class="btn" onclick="document.getElementById('entry-modal').style.display='none'" style="width:100%; margin:0; margin-top:5px; font-size:14px; border-color:#888; color:#aaa;">CLOSE</button>
    </div>

    <div id="inventory" class="panel">
        <div class="panel-header">[ BACKPACK ]</div>
        <div class="grid" id="inv-grid"></div>
    </div>

    <div id="craft-panel" class="panel">
        <div class="panel-header" style="color:#d0d; border-color:#d0d;">[ BLACKSMITH ]</div>
        <div id="craft-list" style="max-height: 250px; overflow-y: auto;"></div>
    </div>

    <div id="shop-panel" class="panel">
        <div class="panel-header" style="color:#0ff; border-color:#0ff;">[ MERCHANT ]</div>
        <div class="grid" id="shop-grid" style="grid-template-columns:repeat(5, 1fr);"></div>
        <div style="display: flex; justify-content: space-between; margin-top: 15px;">
            <button class="btn" style="border-color:#0ff; color:#0ff; font-size:16px; min-width:auto; padding:8px;" onclick="closeAllMenus()" id="btn-shop-close">LEAVE</button>
            <button class="btn" style="border-color:#f00; color:#f00; font-size:16px; min-width:auto; padding:8px;" onclick="window.sell()">SELL ITEM</button>
        </div>
    </div>
    
    <div id="char-panel" class="panel">
        <div class="panel-header" style="color:#fa0; border-color:#fa0;">[ HERO ]</div>
        <div style="display:flex; justify-content:center; gap:10px; margin-bottom:15px;">
            <div class="slot" id="eq-head" title="Head"></div>
            <div class="slot" id="eq-body" title="Body"></div>
            <div class="slot" id="eq-hand" title="Weapon"></div>
            <div class="slot" id="eq-rune" title="Rune"></div> 
            <div class="slot" id="eq-potion" title="Quick Potion"></div>
        </div>
        <div style="text-align:center; color:#fb0; margin-bottom:10px; font-size:20px; font-family:'Cinzel';">POINTS: <span id="cp-pts">0</span></div>
        <div class="stat-row"><span style="color:#f88">STR</span> <div><span id="val-str">5</span> <div class="plus-btn" onclick="addStat('str')">+</div></div></div>
        <div class="stat-row"><span style="color:#8f8">DEX</span> <div><span id="val-dex">5</span> <div class="plus-btn" onclick="addStat('dex')">+</div></div></div>
        <div class="stat-row"><span style="color:#88f">INT</span> <div><span id="val-int">5</span> <div class="plus-btn" onclick="addStat('int')">+</div></div></div>
        <hr style="border:0; border-top:1px dashed #500; margin:10px 0;">
        <div style="font-size:16px; color:#aaa; text-align: center;">DMG: <span id="stat-dmg" style="color:#fff">0</span> | SPD: <span id="stat-spd" style="color:#fff">0</span></div>
    </div>
</div>

<div id="mobile-controls">
    <div id="joystick-base"></div>
    <div id="joystick-knob"></div>
    <div id="joystick-area"></div>
    <div id="action-container">
        <div id="btn-potion" class="action-btn" data-action="potion">POT</div>
        <div id="btn-skill" class="action-btn" data-action="skill">SKL</div>
        <div id="btn-dash" class="action-btn" data-action="dash">DSH</div>
        <div id="btn-atk" class="action-btn" data-action="attack">ATK</div>
    </div>
</div>

<div id="mobile-menu-buttons">
    <div class="skill-btn" data-action="toggle_inv">INV</div>
    <div class="skill-btn" data-action="toggle_char">CHR</div>
    <div class="skill-btn" data-action="toggle_craft">CFT</div>
    <div class="skill-btn" data-action="toggle_chat" style="border-color:#fff; color:#fff;">MSG</div>
</div>

<div id="menu">
    <h1>DIABLOCK</h1>
    <p style="color:#d00; margin-bottom:30px; font-size:32px; letter-spacing: 6px; font-family: 'Cinzel', serif; text-shadow: 0 0 10px #500;">LEGACY OF SHADOWS</p>
    <div id="login-form" style="display:flex; flex-direction: column; align-items: center;">
        <input type="text" id="username" placeholder="ENTER USERNAME" style="text-align:center; border-color:#800; color:#f88;">
        <br>
        <button class="btn" onclick="login()">ENTER THE VOID</button>
    </div>
    <div id="char-select" style="display:none; text-align:center;">
        <div id="char-list" style="margin-bottom:20px; display:flex; flex-direction:column; gap:10px; max-height: 200px; overflow-y:auto;"></div>
        <div style="border-top: 1px solid #300; padding-top:20px;">
            <input type="text" id="cname" placeholder="HERO NAME">
            <select id="cclass" style="background:#100; color:#f00; border:2px solid #500;">
                <option value="knight">WARRIOR (Melee)</option>
                <option value="hunter">RANGER (Bow)</option>
                <option value="mage">WIZARD (Magic)</option>
            </select>
            <br>
            <button class="btn" onclick="create()">SUMMON HERO</button>
        </div>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/game.js"></script>
<script>
    // Lógica simples de UI para o index, para evitar erros antes do game.js carregar
    function dungeonAction(type) {
        if(typeof socket !== 'undefined') {
            socket.emit("dungeon_entry_choice", type);
            document.getElementById('entry-modal').style.display = 'none';
        }
    }
    
    function updateCheckpointList(maxDepth) {
        const list = document.getElementById('checkpoint-list');
        list.innerHTML = "";
        
        const btn0 = document.createElement("div");
        btn0.className = "checkpoint-btn btn"; // Reutiliza estilo btn
        btn0.style.minWidth = "auto"; 
        btn0.style.fontSize = "16px";
        btn0.innerText = "Floor 1 (Surface)";
        btn0.onclick = () => dungeonAction(1);
        list.appendChild(btn0);

        for (let i = 5; i <= maxDepth; i += 5) {
            const btn = document.createElement("div");
            btn.className = "checkpoint-btn btn";
            btn.style.minWidth = "auto";
            btn.style.fontSize = "16px";
            btn.innerText = `Floor ${i} (Checkpoint)`;
            btn.onclick = () => dungeonAction(i);
            list.appendChild(btn);
        }
    }

    function toggleUI(p) {
        if(typeof uiState !== 'undefined') {
            uiState[p] = !uiState[p];
            updateUI();
        }
    }
</script>
</body>
</html>
